<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Luxe Mart</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a1a2e;
    --accent:  #e8b86d;
    --accent2: #c97b4b;
    --surface: #f8f5f0;
    --border:  #e8e0d5;
    --text:    #1a1a2e;
    --muted:   #7a7a8a;
    --danger:  #e74c3c;
    --success: #2ecc71;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 2.5rem;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 40px 80px rgba(0,0,0,.4);
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--accent);
    text-align: center;
    display: block;
    margin-bottom: .25rem;
    text-decoration: none;
  }
  .logo span { color: var(--muted); font-weight: 400; }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
    margin-bottom: 2rem;
  }
  .icon { text-align: center; font-size: 3rem; margin-bottom: 1rem; }
  h2 { text-align: center; font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: .4rem; }
  .desc { text-align: center; color: var(--muted); font-size: .88rem; margin-bottom: 1.75rem; line-height: 1.6; }

  .form-group { margin-bottom: 1.1rem; }
  .form-group label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: .4rem; }
  .pw-wrap { position: relative; }
  .pw-wrap input {
    width: 100%;
    padding: 11px 44px 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: .9rem;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color .2s;
    color: var(--text);
  }
  .pw-wrap input:focus { border-color: var(--accent); }
  .pw-eye {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--muted);
    display: flex; align-items: center; padding: 4px; transition: color .2s;
  }
  .pw-eye:hover { color: var(--accent); }

  .btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: var(--primary);
    border: none;
    padding: 14px;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: .3s;
    margin-top: .5rem;
  }
  .btn:hover { opacity: .9; transform: translateY(-2px); }
  .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .alert {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: .85rem;
    margin-bottom: 1rem;
    display: none;
    line-height: 1.5;
  }
  .alert.error   { background: rgba(231,76,60,.08);  border: 1px solid rgba(231,76,60,.25);  color: var(--danger); }
  .alert.success { background: rgba(46,204,113,.08); border: 1px solid rgba(46,204,113,.25); color: #1a7a44; }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 1.25rem;
    color: var(--muted);
    font-size: .85rem;
    text-decoration: none;
  }
  .back-link:hover { color: var(--accent); }

  /* expired state */
  #expiredBox { display: none; text-align: center; }
  #expiredBox p { color: var(--muted); font-size: .9rem; margin-bottom: 1.5rem; line-height: 1.6; }
</style>
</head>
<body>

<div class="card">
  <a class="logo" href="index.html">LUXE<span> MART</span></a>
  <p class="subtitle">Premium Shopping</p>

  <!-- Reset form -->
  <div id="resetBox">
    <div class="icon">🔒</div>
    <h2>Set New Password</h2>
    <p class="desc">Enter a new password for your account. Must be at least 6 characters.</p>

    <div class="alert error"   id="errMsg"></div>
    <div class="alert success" id="okMsg"></div>

    <div class="form-group">
      <label>New Password</label>
      <div class="pw-wrap">
        <input type="password" id="newPassword" placeholder="••••••••" required>
        <button type="button" class="pw-eye" onclick="togglePw('newPassword', this)" tabindex="-1">
          <svg id="newPassword-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label>Confirm New Password</label>
      <div class="pw-wrap">
        <input type="password" id="confirmPassword" placeholder="••••••••" required onkeydown="if(event.key==='Enter') doReset()">
        <button type="button" class="pw-eye" onclick="togglePw('confirmPassword', this)" tabindex="-1">
          <svg id="confirmPassword-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn" id="resetBtn" onclick="doReset()">Update Password</button>
    <a href="index.html" class="back-link">← Back to Store</a>
  </div>

  <!-- Expired / invalid token state -->
  <div id="expiredBox">
    <div class="icon">⚠️</div>
    <h2>Link Expired</h2>
    <p>This password reset link is invalid or has expired.<br>Reset links are only valid for <strong>15 minutes</strong>.</p>
    <a href="index.html" class="btn" style="display:block; text-align:center; text-decoration:none; padding:14px;">Request a New Link</a>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const TOKEN  = params.get('token');
const EMAIL  = params.get('email');

// If no token/email in URL, show expired box immediately
if (!TOKEN || !EMAIL) {
  document.getElementById('resetBox').style.display    = 'none';
  document.getElementById('expiredBox').style.display  = 'block';
}

function togglePw(inputId, btn) {
  const input = document.getElementById(inputId);
  const icon  = document.getElementById(inputId + '-icon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    btn.style.color = 'var(--accent)';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    btn.style.color = '';
  }
}

function showError(msg) {
  const el = document.getElementById('errMsg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('okMsg').style.display = 'none';
}
function showSuccess(msg) {
  const el = document.getElementById('okMsg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('errMsg').style.display = 'none';
}

async function doReset() {
  const newPw  = document.getElementById('newPassword').value;
  const confPw = document.getElementById('confirmPassword').value;

  if (!newPw)           { showError('Please enter a new password.'); return; }
  if (newPw.length < 6) { showError('Password must be at least 6 characters.'); return; }
  if (newPw !== confPw) { showError('Passwords do not match.'); return; }

  const btn  = document.getElementById('resetBtn');
  btn.textContent = 'Updating...';
  btn.disabled    = true;

  try {
    const res  = await fetch('/api/auth/reset-password', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ token: TOKEN, email: EMAIL, password: newPw })
    });
    const data = await res.json();

    if (res.ok) {
      showSuccess('✅ Password updated! Redirecting to login...');
      btn.style.display = 'none';
      setTimeout(() => window.location.href = 'index.html', 2500);
    } else if (res.status === 400) {
      // Token expired or invalid
      document.getElementById('resetBox').style.display   = 'none';
      document.getElementById('expiredBox').style.display = 'block';
    } else {
      showError(data.error || 'Something went wrong. Please try again.');
      btn.textContent = 'Update Password';
      btn.disabled    = false;
    }
  } catch (e) {
    showError('Cannot connect to server. Make sure XAMPP/WAMP is running.');
    btn.textContent = 'Update Password';
    btn.disabled    = false;
  }
}
</script>

</body>
</html>
